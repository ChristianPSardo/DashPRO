<script>
var DashAnalytics = (function () {
  'use strict';
  const pageSheets={overview:'BASE',requests:'BASE',quality:'BASE',replacements:'REPOSIÇÔES',production:'LINK',asakai:'AsakaiDash',articles:'Página5'};
  const distinct=(rs,key)=>new Set(rs.map(r=>r[key]).filter(v=>v!=null&&v!==''));
  const sum=(rs,key)=>rs.reduce((s,r)=>s+(typeof r[key]==='number'?r[key]:0),0);
  const ratio=(n,d)=>d?n/d:null;
  const pair=r=>JSON.stringify([r.op||null,r.request||null]);
  function prepare(snapshot){
    if(!snapshot || snapshot.version!==1 || !snapshot.tables || !snapshot.unavailable || !Array.isArray(snapshot.diagnostics) || !Number.isFinite(Date.parse(snapshot.readStartedAt)) || !Number.isFinite(Date.parse(snapshot.readFinishedAt)))throw new Error('Snapshot inválido ou incompatível. Atualize novamente.');
    new Intl.DateTimeFormat('pt-BR',{timeZone:snapshot.timeZone}).format(new Date(snapshot.readStartedAt));
    Object.values(snapshot.tables).forEach(t=>{if(!Array.isArray(t.columns)||!Array.isArray(t.rows)||new Set(t.columns).size!==t.columns.length||t.rows.some(r=>!Array.isArray(r)||r.length!==t.columns.length))throw new Error('Snapshot com tabela inválida.');});
    const records={};Object.entries(snapshot.tables).forEach(([name,t])=>{records[name]=t.rows.map(cells=>Object.fromEntries(t.columns.map((key,i)=>[key,cells[i]])));});
    const q=records.QUALIDADE||[],b=records.BASE||[];
    return {snapshot,records,indexes:{qualityOps:distinct(q,'op'),qualityRequests:distinct(q,'request'),baseOps:distinct(b,'op'),baseRequests:distinct(b,'request'),qualityPairs:new Set(q.map(pair))}};
  }
  function filterRows(rows,state={}){
    const dims=Object.entries(state.dimensions||{}).filter(([,v])=>v!==null).map(([k,v])=>[k,new Set(v)]);
    return rows.filter(r=>dims.every(([k,s])=>s.has(r[k]==null||r[k]===''?'(SEM INFORMAÇÃO)':String(r[k])))&&(!state.from||r.dateValid!==false&&r.date>=state.from)&&(!state.to||r.dateValid!==false&&r.date&&r.date<=state.to));
  }
  function aggregate(rows,field,metric){
    const map=new Map();for(const r of rows){const k=r[field]==null||r[field]===''?'(SEM INFORMAÇÃO)':String(r[field]);map.set(k,(map.get(k)||0)+(metric?(typeof r[metric]==='number'?r[metric]:0):1));}
    return [...map].map(([label,value])=>({label,value,keys:[label]})).sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label,'pt-BR'));
  }
  function rank(id,title,rows,field,metric,unit='registros'){
    let data=aggregate(rows,field,metric);if(data.length>10){const rest=data.slice(10);data=data.slice(0,10).concat([{label:'Outros',value:rest.reduce((s,r)=>s+r.value,0),keys:rest.flatMap(r=>r.keys)}]);}
    return {id,title,type:'bars',field,unit,data};
  }
  function rateRank(rows){
    const groups=new Map();
    rows.forEach(r=>{const label=r.article||'(SEM INFORMAÇÃO)';if(!groups.has(label))groups.set(label,{label,keys:[label],numerator:0,denominator:0});const g=groups.get(label);g.numerator+=typeof r.pieces==='number'?r.pieces:0;g.denominator+=typeof r.produced==='number'?r.produced:0;});
    let data=[...groups.values()].map(g=>({...g,value:ratio(g.numerator*1000,g.denominator)})).sort((a,b)=>a.value===null?b.value===null?a.label.localeCompare(b.label,'pt-BR'):1:b.value===null?-1:b.value-a.value||a.label.localeCompare(b.label,'pt-BR'));
    if(data.length>10){const rest=data.slice(10),n=rest.reduce((s,r)=>s+r.numerator,0),d=rest.reduce((s,r)=>s+r.denominator,0);data=data.slice(0,10).concat([{label:'Outros',keys:rest.flatMap(r=>r.keys),value:ratio(n*1000,d),numerator:n,denominator:d}]);}
    return {id:'articleRate',title:'Peças solicitadas por mil produzidas',type:'bars',field:'article',unit:'peças / mil',data};
  }
  function trend(id,title,rows,metric,unit='registros'){
    const map=new Map();rows.filter(r=>r.dateValid!==false&&r.date).forEach(r=>{const m=r.date.slice(0,7);map.set(m,(map.get(m)||0)+(metric?(r[metric]||0):1));});
    return {id,title,type:'trend',field:'date',unit,data:[...map].sort(([a],[b])=>a.localeCompare(b)).map(([label,value])=>({label,value,keys:[label]}))};
  }
  function kpi(id,label,value,format='number',help=''){return {id,label,value,format,help};}
  function diagnostics(p,sheets){return (p.snapshot.diagnostics||[]).filter(d=>sheets.includes(d.sheet));}
  function quality(p,cohortFilters={},eventFilters={}){
    const base=filterRows(p.records.BASE||[],cohortFilters),all=p.records.QUALIDADE||[];
    const ops=distinct(base,'op'),req=distinct(base,'request');
    const linked=all.filter(r=>r.request?req.has(r.request):ops.has(r.op));
    const events=filterRows(linked,eventFilters);
    const covOps=[...ops].filter(v=>p.indexes.qualityOps.has(v)).length,covReq=[...req].filter(v=>p.indexes.qualityRequests.has(v)).length;
    const basePairs=new Set(base.map(pair)),matchedPairs=[...basePairs].filter(k=>p.indexes.qualityPairs.has(k)).length;
    const groups=new Map();for(const r of events){const k=pair(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}
    const latest=[];let reinspections=0;
    groups.forEach(rs=>{
      if(rs.length>1)reinspections++;
      const dated=rs.filter(r=>r.date&&r.dateValid!==false).sort((a,b)=>(b.dateTime||b.date).localeCompare(a.dateTime||a.date));
      if(!dated.length)return;
      const stamp=dated[0].dateTime||dated[0].date, tied=dated.filter(r=>(r.dateTime||r.date)===stamp),results=distinct(tied,'status');
      latest.push({op:rs[0].op,request:rs[0].request,date:dated[0].date,result:results.size>1?'CONFLITANTE':dated[0].status,events:rs.length});
    });
    const orphan=all.filter(r=>r.request?!p.indexes.baseRequests.has(r.request):!p.indexes.baseOps.has(r.op));
    const invalid=events.filter(r=>!r.date||r.dateValid===false).length;
    let flagDivergences=0;
    const rows=base.map(r=>{
      const auditOp=p.indexes.qualityOps.has(r.op),auditRequest=r.request?p.indexes.qualityRequests.has(r.request):null;
      if(r.opFlag&&(['SIM','NÃO'].includes(r.opFlag))&&((r.opFlag==='SIM')!==auditOp))flagDivergences++;
      if(r.request&&r.requestFlag&&(['SIM','NÃO'].includes(r.requestFlag))&&((r.requestFlag==='SIM')!==auditRequest))flagDivergences++;
      return {...r,auditOp:auditOp?'AUDITADA':'NÃO AUDITADA',auditRequest:auditRequest===null?'SEM CHAVE':auditRequest?'AUDITADA':'NÃO AUDITADA'};
    });
    const metrics={opCoverage:ratio(covOps,ops.size),requestCoverage:ratio(covReq,req.size),opDenominator:ops.size,requestDenominator:req.size,auditedOps:covOps,auditedRequests:covReq,nonAuditedOps:ops.size-covOps,nonAuditedRequests:req.size-covReq,approval:ratio(events.filter(r=>r.status==='APROVADO').length,events.length),reinspections,orphanEvents:orphan.length,matchedPairs,invalidChronology:invalid,flagDivergences,missingRequest:base.filter(r=>!r.request).length};
    return {metrics,events,latest,orphanEvents:orphan,rows,diagnostics:diagnostics(p,['BASE','QUALIDADE']),kpis:[
      kpi('opCoverage','Cobertura de OPs',metrics.opCoverage,'percent',covOps+' auditadas / '+ops.size+' OPs únicas da BASE. Auditada em algum momento até esta leitura.'),
      kpi('requestCoverage','Cobertura de solicitações',metrics.requestCoverage,'percent',covReq+' auditadas / '+req.size+' solicitações únicas da BASE. Sem chave fica fora do denominador.'),
      kpi('nonAuditedRequests','Solicitações sem auditoria',metrics.nonAuditedRequests,'number','Solicitações únicas da coorte sem evento correspondente.'),
      kpi('approval','Aprovação por evento',metrics.approval,'percent','APROVADO / eventos com resultado válido vinculados à coorte. Filtros de evento não mudam a cobertura.')],charts:[
        {id:'coverage',title:'Cobertura da Qualidade',type:'coverage',field:'auditRequest',unit:'solicitações únicas',data:[{label:'Auditadas',value:covReq,keys:['AUDITADA']},{label:'Não auditadas',value:req.size-covReq,keys:['NÃO AUDITADA']}]},
        trend('auditTrend','Atividade por data de auditoria',events),rank('results','Resultados de auditoria',events,'status'),rank('shifts','Turno auditado',events,'auditShift')
      ]};
  }
  function view(p,page,state={}){
    if(page==='quality')return quality(p,state,{});
    const sheet=pageSheets[page],rs=filterRows(p.records[sheet]||[],state);
    if(page!=='overview'&&page!=='requests')return operational(p,page,rs);
    const q=quality(p,state,{});
    return {rows:rs,diagnostics:diagnostics(p,['BASE']),kpis:[kpi('records','Registros de solicitação',rs.length,'number','Linhas com ID ITEM e OP. IDs repetidos não são excluídos automaticamente.'),kpi('items','Itens distintos',distinct(rs,'itemId').size),kpi('pieces','Peças solicitadas',sum(rs,'pieces'),'number','Soma de FALTA TOTAL por registro; pode conter itens repetidos.'),page==='overview'?q.kpis[1]:kpi('ops','OPs distintas',distinct(rs,'op').size)].concat(page==='overview'?[kpi('ops','OPs distintas',distinct(rs,'op').size)]:[]).concat([kpi('requests','Solicitações distintas',distinct(rs,'request').size),kpi('missingRequest','Registros sem solicitação',rs.filter(r=>!r.request).length)]),charts:[trend('monthly','Evolução das solicitações',rs),rank('reasons','Principais motivos',rs,'reason'),rank('areas','Áreas causadoras',rs,'area'),rank('pcp','Análise PCP',rs,'pcp')]};
  }
  function operational(p,page,rs){
    const model={rows:rs,diagnostics:diagnostics(p,[pageSheets[page]]),metrics:{},kpis:[],charts:[]};
    if(page==='replacements'){
      const today=new Intl.DateTimeFormat('en-CA',{timeZone:p.snapshot.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(p.snapshot.readStartedAt));
      const days=rs.map(r=>r.date&&r.endDate&&r.date<=today&&r.endDate<=today&&r.endDate>=r.date ? (Date.parse(r.endDate)-Date.parse(r.date))/86400000:null).filter(v=>v!==null).sort((a,b)=>a-b);
      const mid=Math.floor(days.length/2),median=days.length?(days.length%2?days[mid]:(days[mid-1]+days[mid])/2):null;
      model.metrics={ops:distinct(rs,'op').size,requests:distinct(rs,'request').size,leadEligible:days.length,leadExcluded:rs.length-days.length};
      model.kpis=[kpi('records','Registros de reposição',rs.length),kpi('pieces','Peças por item',sum(rs,'pieces'),'number','Soma de linhas de itens, não volume único de OP.'),kpi('kg','Consumo válido',sum(rs,'kg'),'kg','Valores inválidos ficam fora da soma.'),kpi('leadTime','Prazo mediano',median,'days',days.length+' prazos válidos; '+model.metrics.leadExcluded+' excluídos. DATA até RECEBIMENTO SLMB.'),kpi('requests','Solicitações distintas',model.metrics.requests),kpi('ops','OPs distintas',model.metrics.ops)];
      model.charts=[trend('replacementTrend','Reposições no período',rs),rank('depot','Status do depósito',rs,'depot'),rank('cut','Status do corte',rs,'cut'),rank('cd','Status do CD',rs,'cd'),rank('types','Tipos de reposição',rs,'type')];
    }else if(page==='production'){
      model.kpis=[kpi('produced','Peças apontadas',sum(rs,'produced'),'number','SAFL-QtPCON por registro; não volume físico único de OP.'),kpi('ops','OPs distintas',distinct(rs,'op').size),kpi('requests','Solicitações distintas',distinct(rs,'request').size),kpi('secondQuality','Segunda qualidade apontada',sum(rs,'secondQuality'))];
      model.charts=[trend('productionTrend','Produção por data de conclusão',rs,'produced','peças apontadas'),rank('units','Unidades de produção',rs,'unit','produced','peças'),rank('business','Negócios',rs,'business','produced','peças'),rank('collection','Coleções',rs,'collection','produced','peças'),rank('articles','Artigos produzidos',rs,'article','produced','peças')];
    }else if(page==='articles'){
      model.rows=rs.map(r=>({...r,perThousand:ratio((r.pieces||0)*1000,r.produced)}));
      model.kpis=[kpi('articles','Artigos no resumo',distinct(rs,'article').size),kpi('produced','Produzido no resumo',sum(rs,'produced')),kpi('pieces','Solicitado no resumo',sum(rs,'pieces')),kpi('perThousand','Peças solicitadas / mil',ratio(sum(rs,'pieces')*1000,sum(rs,'produced')),'decimal','1000 × peças solicitadas / peças produzidas. Não é contagem de solicitações.')];
      model.charts=[rank('articleRequests','Peças solicitadas por artigo',rs,'article','pieces','peças'),rank('articleVolume','Produção por artigo',rs,'article','produced','peças'),rateRank(rs)];
    }else if(page==='asakai'){
      model.kpis=[kpi('blocks','Blocos disponíveis',distinct(rs,'block').size),kpi('summaryRows','Valores no resumo',rs.length)];
      // A generic summary can mix units. Show source values in their own blocks, never sum them.
      model.charts=[];
    }else throw new Error('Página desconhecida.');
    return model;
  }
  return {prepare,filterRows,quality,view,pageSheets,aggregate};
})();
</script>
